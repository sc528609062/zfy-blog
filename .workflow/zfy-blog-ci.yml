version: '1.0'
name: zfy-blog-ci
displayName: zfy-blog Laravel 验证流水线

triggers:
  push:
    branches:
      precise:
        - master
        - main
      include:
        - dev.*
        - feature.*
  pr:
    branches:
      precise:
        - master
        - main

strategy:
  blocking: true

stages:
  - name: verify
    displayName: 代码验证
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: shell@agent
        name: laravel_verify
        displayName: Laravel 12 / PHP 8.3 验证
        hostGroupID: zfy-blog-php83
        script: |
          php -v
          php -r "exit(PHP_VERSION_ID >= 80300 ? 0 : 1);"
          if [ -f composer.phar ]; then php composer.phar install --no-interaction --prefer-dist; else composer install --no-interaction --prefer-dist; fi
          cp .env.example .env
          php artisan key:generate
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$PWD/database/database.sqlite"
          export CACHE_STORE=array
          export QUEUE_CONNECTION=sync
          export SESSION_DRIVER=array
          mkdir -p database
          touch database/database.sqlite
          php artisan config:clear
          php artisan migrate:fresh --seed --force
          php artisan test
          npm ci
          npm run build

permissions:
  - role: admin
    members: []
